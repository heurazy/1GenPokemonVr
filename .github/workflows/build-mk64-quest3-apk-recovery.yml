name: Build MK64 Quest 3 APK Recovery

on:
  workflow_dispatch:
  push:
    branches: [build-mk64-quest3-apk]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SK_COMMIT: 9253aad869c96a8e660f707a74fe57c5d4ebdd2a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638" "cmake;3.30.3"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip

      - name: Clone source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/izzy2lost/SpaghettiKart.git SpaghettiKart
          cd SpaghettiKart
          git checkout "$SK_COMMIT"
          git submodule update --init --recursive

      - name: Recover and apply Quest patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/decode_truncated_base64.py quest3-kit.b64 quest3-kit.partial.zip
          rm -f quest3-kit.fixed.zip
          printf 'y\n' | zip -FF quest3-kit.partial.zip --out quest3-kit.fixed.zip || true
          test -s quest3-kit.fixed.zip
          mkdir -p quest3-kit
          unzip -o quest3-kit.fixed.zip -d quest3-kit || true
          PATCH_SCRIPT="$(find quest3-kit -type f -name apply_quest3_vr.py -print -quit)"
          test -n "$PATCH_SCRIPT"
          sed -n '1,260p' "$PATCH_SCRIPT"
          python3 -m py_compile "$PATCH_SCRIPT"
          python3 "$PATCH_SCRIPT" SpaghettiKart
          find SpaghettiKart -type f \( -iname '*openxr*' -o -iname '*quest*' -o -iname '*xr*bridge*' \) -print | sort

      - name: Configure SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > SpaghettiKart/android/local.properties

      - name: Build launcher assets
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S SpaghettiKart/torch -B SpaghettiKart/torch/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUSE_STANDALONE=ON \
            -DBUILD_MK64=ON -DBUILD_NAUDIO=ON \
            -DBUILD_SM64=OFF -DBUILD_SF64=OFF -DBUILD_FZERO=OFF -DBUILD_MARIO_ARTIST=OFF
          cmake --build SpaghettiKart/torch/build-host --parallel 2
          SpaghettiKart/torch/build-host/torch pack SpaghettiKart/assets SpaghettiKart/spaghetti.o2r o2r
          mkdir -p SpaghettiKart/android/app/src/main/assets
          cp SpaghettiKart/spaghetti.o2r SpaghettiKart/android/app/src/main/assets/
          test -s SpaghettiKart/android/app/src/main/assets/spaghetti.o2r

      - name: Build APK
        working-directory: SpaghettiKart/android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=SpaghettiKart/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" > apk-badging.txt
          unzip -l "$APK" | grep -E 'spaghetti\.o2r|libSpaghettify\.so' > apk-required-files.txt
          grep -q spaghetti.o2r apk-required-files.txt
          grep -q libSpaghettify.so apk-required-files.txt
          mkdir output
          cp "$APK" output/MarioKart64-Quest3-VR-debug.apk
          cp apk-badging.txt apk-required-files.txt output/
          sha256sum output/MarioKart64-Quest3-VR-debug.apk > output/MarioKart64-Quest3-VR-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MarioKart64-Quest3-VR-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14
