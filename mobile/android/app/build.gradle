import java.nio.charset.StandardCharsets

apply plugin: 'com.android.application'

android {
    namespace "org.love2d.android.executable"
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId project.properties["app.application_id"]
        versionCode project.properties["app.version_code"].toInteger()
        versionName project.properties["app.version_name"]
        minSdk 16
        compileSdk 34
        targetSdk 34
        
        def getAppName = {
            def nameArray = project.properties["app.name_byte_array"]
            def name = project.properties["app.name"]
            if (name != null && nameArray != null) {
                throw new Exception("Only define either `app.name` or `app.name_byte_array` in gradle.properties, but not both!")
            }

            if (name == null) {
                def nameArraySplit = nameArray.split(",")
                def nameBytes = new byte[nameArraySplit.length]
                def count = 0
                for (String s: nameArraySplit) {
                    nameBytes[count++] = (byte) Integer.parseInt(s)
                }
                return new String(nameBytes, StandardCharsets.UTF_8)
            }
            return name
        }

        manifestPlaceholders = [
            NAME:getAppName(),
            ORIENTATION:project.properties["app.orientation"],
        ]
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // This project distributes a sideload preview rather than a
            // Play Store bundle. Keep the optimized release installable with
            // the same local development certificate used by debug builds.
            signingConfig signingConfigs.debug
        }
    }
    flavorDimensions = ['mode', 'recording']
    productFlavors {
        normal {
            dimension 'mode'
        }
        embed {
            dimension 'mode'
        }
        quest {
            dimension 'mode'
            applicationId "com.heurazy.gen1pokemonvr.quest"
            minSdk 24
            ndk {
                // Meta Quest is ARM64-only, and the OpenXR bridge is built
                // only for this ABI. Do not package unusable desktop/legacy
                // LÖVE libraries into the standalone headset APK.
                abiFilters 'arm64-v8a'
            }
        }
        record {
            dimension 'recording'
        }
        noRecord {
            dimension 'recording'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    api 'androidx.multidex:multidex:2.0.1'
    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'androidx.appcompat:appcompat:1.6.1'
    api project(':love')
}
